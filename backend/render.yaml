services:
  - type: web
    name: neuroguardai-backend
    env: python
    region: oregon
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app -c gunicorn.conf.py
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
